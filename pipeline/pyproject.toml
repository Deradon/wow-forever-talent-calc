[project]
name = "wowtalents"
version = "0.1.0"
description = "WoW Forever talent-extraction pipeline: video probe, frame/tooltip extraction, VLM reading, export"
readme = "README.md"
authors = [
    { name = "Deradon" }
]
requires-python = ">=3.12"
dependencies = [
    "av>=14.0,<14.3",
    "imagehash~=4.3",
    "jsonschema~=4.23",
    "numpy~=2.0",
    "openai~=1.0",
    "opencv-python-headless~=4.10",
    "pillow~=11.0",
    "pydantic~=2.0",
    "rapidfuzz~=3.0",
    "requests~=2.32",
    "typer~=0.15",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
