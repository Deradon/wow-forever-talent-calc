name: Deploy to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: uv sync --frozen
        working-directory: pipeline
      - run: uv run pytest -q
        working-directory: pipeline
      # Rule 12 of docs/DATA-SCHEMA.md: the canonical files must equal the
      # serializer output byte-for-byte. Fails the deploy on bad data.
      - run: uv run python validate.py --check ../data/talents/*.json
        working-directory: pipeline
      # Same rule for races (docs/DATA-SCHEMA-RACES.md section 7, R12 and M1-M4).
      - run: uv run python validate_races.py --check ../data/races/*.json
        working-directory: pipeline
      # Same rule for the spellbook files (rules S1-S15 of validate_spells.py).
      - run: uv run python validate_spells.py --check ../data/spells/*.json
        working-directory: pipeline
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # The generated indexes under web/src/data are committed and the build
      # reads them, so a stale commit would deploy content nobody reviewed.
      # The generator no longer runs from vite.config.ts outside `npm run dev`,
      # which is what makes this check meaningful (code review K-2).
      - run: npm run gen && git diff --exit-code -- src/data
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npx vitest run
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
  deploy:
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v5
